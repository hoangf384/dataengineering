services:
  spark-master:
    build:
      context: .
      dockerfile: Dockerfile
    image: spark-extended:3.5.1
    container_name: spark-master
    restart: unless-stopped

    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
      --ip 0.0.0.0
      --port 7077
      --webui-port 8080

    env_file:
      - .env

    environment:
      SPARK_LOCAL_IP: 0.0.0.0
      SPARK_MASTER_WEBUI_PORT: 8080
      SPARK_DAEMON_MEMORY: 512m
      TZ: ${TZ}

    volumes:
      - ~/dataengineering/data:/data:z
      - ~/dataengineering/code:/code:z

    ports:
      - "8080:8080"
      - "7077:7077"

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G

  spark-worker:
    image: spark-extended:3.5.1
    container_name: spark-worker
    restart: unless-stopped
    depends_on:
      - spark-master

    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077

    env_file:
      - .env

    environment:
      SPARK_LOCAL_IP: 0.0.0.0
      SPARK_WORKER_CORES: 1
      SPARK_WORKER_MEMORY: 4g
      SPARK_DAEMON_MEMORY: 512m
      TZ: ${TZ}

    volumes:
      - ~/dataengineering/data:/data:z
      - ~/dataengineering/code:/code:z

    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 5.5G
